<!DOCTYPE html>
<html lang="en">
<head>
    <title>Swift RPC Server</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <style>
        :root {
            --bs-body-font-size: 0.95rem;
        }

        .status-ACTIVE {
            color: var(--bs-primary);
            font-weight: bold;
        }

        .status-DONE {
            color: var(--bs-success);
            font-weight: bold;
        }

        .status-ERROR {
            color: var(--bs-danger);
            font-weight: bold;
        }

        .table {
            --bs-table-bg: transparent !important;
            background-color: transparent !important;
        }

        td {
            font-family: monospace;
            font-size: 0.9rem;
        }

        #server_info {
            font-size: 0.8rem;
            opacity: 0.6;
            column-gap: 1em;
        }

        .server-value {
            font-family: monospace;
            color: var(--bs-primary);
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.8em;
            margin: 0;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="p-5 bg-tertiary">
<div class="container-fluid">
    <header>
        <div class="row pb-3 mb-3 border-bottom">
            <div class="col-auto d-flex text-dark">
                <a href="/" class="text-dark text-decoration-none">
                    <?xml version="1.0" encoding="UTF-8"?>
                    <svg class="me-2" width="50" height="40" role="img" viewBox="0 0 118 94" xmlns="http://www.w3.org/2000/svg">
                        <path transform="matrix(1 0 -.2566 .9665 0 0)"
                              d="m38.49 6.154c-7.106 0-12.83 5.723-12.83 12.83l-7.53e-4 59.69c0 7.106 5.722 12.83 12.83 12.83h66.12c7.106 0 12.82-5.723 12.82-12.83l7.5e-4 -59.69c0-7.106-5.722-12.83-12.83-12.83h-66.12zm44.41 16.95 13.81 14.27-0.06917 7.094h-52.62l-0.1147-8.978h40.64l-6.693-6.951 5.048-5.431zm-38.45 27.68h52.62l0.1162 8.984h-40.64l6.691 6.945-5.048 5.431-13.81-14.26 0.06764-7.1z"
                              fill="currentColor" style="paint-order:stroke markers fill"/>
                    </svg>
                </a>
                <div class="d-flex flex-column">
                    <div class="fs-5 lh-1">Swift RPC Server&nbsp;&#8942;&nbsp;<span class="text-primary fw-light" id="server_name"></span></div>
                    <small class='fw-light ' id='server_version'></small>
                </div>
            </div>

            <div class="col d-flex justify-content-end">
                <nav class="ms-auto">
                    <a class="me-3 py-2 text-dark text-decoration-none"
                       href="https://github.com/michel4j/swift-rpc/blob/master/README.rst">Docs</a>
                    <a class="me-3 py-2 text-dark text-decoration-none" href="https://github.com/michel4j/swift-rpc">Source
                        Code</a>
                    <a class="me-3 py-2 text-dark text-decoration-none" href="https://pypi.org/project/szrpc/">Releases</a>
                    <a class="py-2 text-dark text-decoration-none" href="https://github.com/michel4j/swift-rpc/issues">Issues</a>
                </nav>
            </div>

        </div>
        <div class="d-flex flex-column pb-3 mb-4 border-bottom">
            <div class="lead" id="server_description"></div>
            <div class="d-flex flex-row flex-wrap text-secondary" id="server_info"></div>
        </div>
    </header>
    <div class="row row-cols-1 row-cols-md-4 mb-3 text-center" id="stats">
        <div class="col">
            <div class="card mb-4 rounded-3 text-primary-emphasis bg-primary-subtle shadow-sm">
                <div class="card-header py-2"><h4 class="my-0 fw-normal">Uptime</h4></div>
                <div class="card-body"><span class="fs-2 fw-light" id="uptime">-</span></div>
            </div>
        </div>
        <div class="col">
            <div class="card mb-4 rounded-3 text-info-emphasis bg-info-subtle shadow-sm">
                <div class="card-header py-2"><h4 class="my-0 fw-normal">Requests</h4></div>
                <div class="card-body"><span class="fs-2 fw-light" id="total_requests">-</span></div>
            </div>
        </div>
        <div class="col">
            <div class="card mb-4 rounded-3 text-danger-emphasis bg-danger-subtle shadow-sm">
                <div class="card-header py-2"><h4 class="my-0 fw-normal">Failed</h4></div>
                <div class="card-body"><span class="fs-2 fw-light" id="total_errors">-</span></div>
            </div>
        </div>
        <div class="col">
            <div class="card mb-4 rounded-3 shadow-sm">
                <div class="card-header py-2"><h4 class="my-0 fw-normal">Workers</h4></div>
                <div class="card-body"><span class="fs-2 fw-light" id="active_workers">-</span></div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 lead">Call History</div>
    </div>
    <div class="row mb-3">
        <div class="col-12">
            <table class="table table-sm">
                <thead>
                <tr>
                    <th>Time</th>
                    <th>Task ID</th>
                    <th>Task Type</th>
                    <th>Worker</th>
                    <th>Status</th>
                    <th>Duration</th>
                </tr>
                </thead>
                <tbody id="active-calls-body"></tbody>
                <tbody id="historical-calls-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header text-bg-primary" data-bs-theme="dark">
                    <h5 class="modal-title">Job Details</h5>
                    <button type="button" class="btn-close text-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <pre id="modal-content"></pre>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>
<script>
    function formatDuration(seconds) {
        // Ensure the input is a non-negative number
        seconds = Math.abs(Number(seconds));

        const days = Math.floor(seconds / (24 * 3600));
        seconds %= (24 * 3600);
        const hours = Math.floor(seconds / 3600);
        seconds %= 3600;
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60); // Use Math.floor for whole seconds

        const parts = [];

        if (days > 0) {
            parts.push(`${days}d`);
        }
        if (hours > 0) {
            parts.push(`${hours}h`);
        }
        if (minutes > 0) {
            parts.push(`${minutes}m`);
        }
        if (remainingSeconds > 0 || parts.length === 0) {
            parts.push(`${remainingSeconds}s`);
        }

        return parts.join(' ');
    }

    async function showDetails(requestId) {
        const modalElement = document.getElementById('detailsModal');
        const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
        document.getElementById('modal-content').innerText = 'Loading...';
        modal.show();

        try {
            console.log(requestId);
            const response = await fetch(`/api/details/${requestId}`);
            const data = await response.json();
            document.getElementById('modal-content').innerText = JSON.stringify(data, null, 2);
        } catch (e) {
            document.getElementById('modal-content').innerText = 'Error loading details';
        }
    }

    async function updateData() {
        try {
            const response = await fetch('/api/data');
            const data = await response.json();
            document.getElementById('server_name').innerText = data.host;
            document.getElementById('server_description').innerText = data.description;
            document.getElementById('uptime').innerText = formatDuration(data.stats.uptime);
            document.getElementById('total_requests').innerText = data.stats.total_requests;
            document.getElementById('total_errors').innerText = data.stats.total_errors;
            document.getElementById('active_workers').innerText = data.stats.active_workers_count;
            document.getElementById('server_version').innerText = data.version;


            const serverInfo = document.getElementById('server_info');
            serverInfo.innerHTML = `
                    <div>frontend:&nbsp;<span class="server-value">${data.frontend}</span></div>
                    <div>backend:&nbsp;<span class="server-value">${data.backend}</span></div>
                    <div>methods:&nbsp;<span class="server-value">${data.methods.join(', ')}</span></div>
                `;

            const activeBody = document.getElementById('active-calls-body');
            activeBody.innerHTML = data.active_calls.map(c => `
                    <tr>
                        <td>${c.date_time}</td>
                        <td><a href="#" onclick="showDetails('${c.request_id}'); return false;">${c.request_id}</a></td>
                        <td>${c.method}</td>
                        <td>${c.worker_id}</td>
                        <td><span class="badge bg-light border status-${c.status}">${c.status}</span></td>
                        <td>${formatDuration((Date.now() / 1000) - c.start_time)}</td>
                    </tr>
                `).join('');

            const historicalBody = document.getElementById('historical-calls-body');
            historicalBody.innerHTML = data.historical_calls.map(c => `
                    <tr>
                        <td>${c.date_time}</td>
                        <td><a href="#" onclick="showDetails('${c.request_id}'); return false;">${c.request_id}</a></td>
                        <td>${c.method}</td>
                        <td>${c.worker_id}</td>
                        <td><span class="badge bg-light border status-${c.status}">${c.status}</span></td>
                        <td>${formatDuration(c.duration)}</td>
                    </tr>
                `).join('');
        } catch (e) {
            console.error("Failed to fetch data", e);
        }
    }

    setInterval(updateData, 1000);
    updateData();
</script>
</body>
</html>
