<!doctype html>
<html lang="en" data-bs-navbar-position="vertical" data-bs-sidebar="folded-hover">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swift RPC Monitor</title>
  <link href="/static/vendor/tabler.min.css" rel="stylesheet">
  <link href="/static/css/monitor.css" rel="stylesheet">
</head>
<body>
  <script src="/static/vendor/tabler-theme.min.js"></script>
  <a class="visually-hidden-focusable skip-link" href="#content">Skip to main content</a>
  <div id="live-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#sidebar-menu"
                aria-controls="sidebar-menu" aria-expanded="false"
                aria-label="Toggle sidebar navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-brand">
          <a href="/" data-nav="/" class="d-inline-flex align-items-center gap-2 text-decoration-none text-reset"
             aria-label="Swift RPC Monitor">
            <svg class="navbar-brand-icon flex-shrink-0" width="28" height="24" viewBox="0 0 118 94"
                 aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
              <path transform="matrix(1 0 -.2566 .9665 0 0)"
                    d="m38.49 6.154c-7.106 0-12.83 5.723-12.83 12.83l-7.53e-4 59.69c0 7.106 5.722 12.83 12.83 12.83h66.12c7.106 0 12.82-5.723 12.82-12.83l7.5e-4 -59.69c0-7.106-5.722-12.83-12.83-12.83h-66.12zm44.41 16.95 13.81 14.27-0.06917 7.094h-52.62l-0.1147-8.978h40.64l-6.693-6.951 5.048-5.431zm-38.45 27.68h52.62l0.1162 8.984h-40.64l6.691 6.945-5.048 5.431-13.81-14.26 0.06764-7.1z"
                    fill="currentColor" style="paint-order:stroke markers fill"/>
            </svg>
            <span class="navbar-brand-title fw-bold">Swift RPC</span>
          </a>
        </div>

        <div class="navbar-footer d-none d-lg-block">
          <button type="button" class="btn btn-ghost-secondary w-100 justify-content-start sidebar-pin-btn"
                  data-bs-toggle="sidebar-folded"
                  aria-label="Pin or unpin sidebar"
                  aria-pressed="true"
                  title="Pin or unpin sidebar">
            <svg class="icon flex-shrink-0" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" focusable="false">
              <path d="M15 4.5l-4 4l-4 1.5l-1.5 1.5l7 7l1.5 -1.5l1.5 -4l4 -4"/>
              <path d="M9 15l-4.5 4.5"/>
              <path d="M14.5 4l5.5 5.5"/>
            </svg>
            <span class="nav-link-title ms-2" id="sidebar-pin-label">Pin sidebar</span>
          </button>
        </div>

        <nav class="collapse navbar-collapse" id="sidebar-menu" aria-label="Monitor navigation">
          <ul class="navbar-nav pt-lg-3">
            <li class="nav-section-title">Monitor</li>
            <li class="nav-item" data-nav-item="/">
              <a class="nav-link" href="/" data-nav="/">
                <span class="nav-link-icon d-md-none d-lg-inline-block">
                  <svg class="icon" width="24" height="24" viewBox="0 0 24 24"
                       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                       aria-hidden="true" focusable="false">
                    <path d="M5 4h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1"/>
                    <path d="M5 16h4a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1"/>
                    <path d="M15 12h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1"/>
                    <path d="M15 4h4a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1"/>
                  </svg>
                </span>
                <span class="nav-link-title">Overview</span>
              </a>
            </li>
            <li class="nav-item" data-nav-item="/workers">
              <a class="nav-link" href="/workers" data-nav="/workers">
                <span class="nav-link-icon d-md-none d-lg-inline-block">
                  <svg class="icon" width="24" height="24" viewBox="0 0 24 24"
                       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                       aria-hidden="true" focusable="false">
                    <path d="M3 4m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/>
                    <path d="M3 12m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/>
                    <path d="M7 8l0 .01"/>
                    <path d="M7 16l0 .01"/>
                  </svg>
                </span>
                <span class="nav-link-title">Workers</span>
                <span class="badge bg-green-lt ms-auto sidebar-badge" id="nav-badge-workers"
                      aria-label="Active Workers">0</span>
              </a>
            </li>
            <li class="nav-item" data-nav-item="/methods">
              <a class="nav-link" href="/methods" data-nav="/methods">
                <span class="nav-link-icon d-md-none d-lg-inline-block">
                  <svg class="icon" width="24" height="24" viewBox="0 0 24 24"
                       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                       aria-hidden="true" focusable="false">
                    <path d="M7 8l-4 4l4 4"/>
                    <path d="M17 8l4 4l-4 4"/>
                    <path d="M14 4l-4 16"/>
                  </svg>
                </span>
                <span class="nav-link-title">Methods</span>
              </a>
            </li>
            <li class="nav-item" data-nav-item="/requests">
              <a class="nav-link" href="/requests" data-nav="/requests">
                <span class="nav-link-icon d-md-none d-lg-inline-block">
                  <svg class="icon" width="24" height="24" viewBox="0 0 24 24"
                       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                       aria-hidden="true" focusable="false">
                    <path d="M3 12h4l3 8l4 -16l3 8h4"/>
                  </svg>
                </span>
                <span class="nav-link-title">Requests</span>
                <span class="badge bg-blue-lt ms-auto sidebar-badge d-none" id="nav-badge-requests"
                      aria-label="Active Requests">0</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </aside>

    <div class="page-wrapper">
      <header class="monitor-topbar sticky-top border-bottom d-print-none">
        <div class="container-xl monitor-topbar-inner">
          <div class="monitor-topbar-left">
            <span id="service-description" class="fw-semibold text-truncate">Swift RPC</span>
            <span id="service-version" class="badge bg-secondary-lt d-none"></span>
            <div class="dropdown" id="broker-endpoints-dropdown">
              <button type="button" class="btn btn-sm btn-ghost-secondary dropdown-toggle"
                      data-bs-toggle="dropdown" data-bs-auto-close="outside"
                      aria-expanded="false" id="broker-endpoints-btn"
                      title="Broker endpoints">
                <svg class="icon icon-sm me-1" width="16" height="16" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                  <path d="M6 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/>
                  <path d="M18 6m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/>
                  <path d="M18 18m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/>
                  <path d="M8.7 10.7l6.6 -3.4"/>
                  <path d="M8.7 13.3l6.6 3.4"/>
                </svg>
                <span>Broker</span>
              </button>
              <div class="dropdown-menu p-3 monitor-endpoints-menu" aria-labelledby="broker-endpoints-btn">
                <div class="dropdown-header px-0 pt-0">Broker Endpoints</div>
                <div id="topbar-broker-endpoints" class="small text-secondary">Waiting for Broker data…</div>
              </div>
            </div>
          </div>

          <div class="monitor-topbar-right">
            <div class="btn-group btn-group-sm" role="group" aria-label="Time window" id="window-selector">
              <button type="button" class="btn active" data-window="15m" aria-pressed="true">15m</button>
              <button type="button" class="btn" data-window="1h" aria-pressed="false">1h</button>
              <button type="button" class="btn" data-window="12h" aria-pressed="false">12h</button>
              <button type="button" class="btn" data-window="1d" aria-pressed="false">1d</button>
              <button type="button" class="btn" data-window="7d" aria-pressed="false">7d</button>
            </div>

            <label class="form-check form-switch mb-0 d-inline-flex align-items-center gap-1" title="Toggle auto-refresh">
              <input class="form-check-input" type="checkbox" id="auto-refresh" checked>
              <span class="form-check-label small text-nowrap">Auto</span>
            </label>

            <button type="button" class="btn btn-sm btn-icon btn-ghost-secondary" id="refresh-now"
                    aria-label="Refresh now" title="Refresh now">
              <svg class="icon" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true" focusable="false">
                <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/>
                <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/>
              </svg>
            </button>

            <button type="button" class="btn btn-sm btn-icon btn-ghost-secondary" id="theme-toggle"
                    aria-label="Toggle light or dark theme" title="Toggle light or dark theme">
              <svg class="icon hide-theme-dark" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true" focusable="false">
                <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/>
              </svg>
              <svg class="icon hide-theme-light" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true" focusable="false">
                <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/>
                <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="connection-banner" class="container-xl pt-3 d-none">
        <div class="alert alert-warning d-flex align-items-center justify-content-between gap-2 mb-0" role="alert">
          <div class="d-flex align-items-center gap-2 min-w-0">
            <svg class="icon alert-icon flex-shrink-0" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" focusable="false">
              <path d="M12 9v4"/>
              <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"/>
              <path d="M12 16h.01"/>
            </svg>
            <div class="min-w-0">
              <strong>Connection lost.</strong>
              <span id="connection-banner-detail">Showing last known data.</span>
            </div>
          </div>
          <button type="button" class="btn btn-sm btn-warning flex-shrink-0" id="connection-retry">Retry</button>
        </div>
      </div>

      <main id="content" class="page-body" tabindex="-1">
        <div class="container-xl" id="page-root"></div>
      </main>

      <footer class="footer footer-transparent d-print-none">
        <div class="container-xl">
          <div class="row text-center align-items-center flex-row-reverse">
            <div class="col-lg-auto ms-lg-auto">
              <ul class="list-inline list-inline-dots mb-0">
                <li class="list-inline-item"><a href="https://github.com/michel4j/swift-rpc/blob/master/README.md" target="_blank" rel="noopener" class="link-secondary">Docs</a></li>
                <li class="list-inline-item"><a href="https://github.com/michel4j/swift-rpc" target="_blank" rel="noopener" class="link-secondary">Source</a></li>
                <li class="list-inline-item"><a href="https://pypi.org/project/szrpc/" target="_blank" rel="noopener" class="link-secondary">Releases</a></li>
                <li class="list-inline-item"><a href="https://github.com/michel4j/swift-rpc/issues" target="_blank" rel="noopener" class="link-secondary">Issues</a></li>
              </ul>
            </div>
            <div class="col-12 col-lg-auto mt-3 mt-lg-0">
              <ul class="list-inline list-inline-dots mb-0 text-secondary">
                <li class="list-inline-item">Swift RPC Monitor</li>
                <li class="list-inline-item">Updated <span id="footer-updated">—</span></li>
              </ul>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <div class="offcanvas offcanvas-end monitor-drawer" tabindex="-1" id="request-details-drawer"
       aria-labelledby="request-details-title">
    <div class="offcanvas-header border-bottom">
      <div class="d-flex flex-column min-w-0 me-2">
        <h2 class="offcanvas-title h4 mb-0 text-truncate" id="request-details-title">Request Details</h2>
        <div class="d-flex align-items-center gap-2 mt-1">
          <code class="small text-secondary text-truncate" id="request-details-id"></code>
          <button type="button" class="btn btn-sm btn-ghost-secondary py-0 px-1 d-none"
                  id="request-details-copy-id" aria-label="Copy Request ID" title="Copy Request ID">Copy ID</button>
        </div>
      </div>
      <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body" id="request-details-body"></div>
  </div>

  <script src="/static/vendor/tabler.min.js" defer></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
