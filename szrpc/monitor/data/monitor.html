<!DOCTYPE html>
<html lang="en">
<head>
    <title>Swift RPC Server</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <style>
        :root {
            --bs-body-font-size: 0.95rem;
            --bs-border-radius: 0.25rem;
            --bs-border-radius-lg: 0.25rem;
            --bs-border-radius-sm: 0.25rem;
        }
        .card {
            --bs-card-border-width: 0;
        }

        .status-ACTIVE {
            color: var(--bs-primary);
            font-weight: bold;
        }

        .status-DONE {
            color: var(--bs-success);
            font-weight: bold;
        }

        .status-ERROR {
            color: var(--bs-danger);
            font-weight: bold;
        }

        .table {
            --bs-table-bg: transparent !important;
            background-color: transparent !important;
        }

        td {
            /*font-family: monospace;*/
            font-size: 0.8rem;
        }

        #server_info {
            font-size: 0.8rem;
            opacity: 0.7;
            column-gap: 1em;
        }

        .server-value {
            font-family: monospace;
            color: var(--bs-primary);
        }

        .chart-card {
            height: 280px;
        }

        .chart-card canvas {
            max-height: 220px;
        }

        #worker-sparklines-card {
            content-visibility: auto;
            contain-intrinsic-size: auto none auto 220px;
        }

        .worker-spark-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
        }

        .worker-spark-card {
            container: worker-card / inline-size;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border: 1px solid var(--bs-border-color);
            border-radius: var(--bs-border-radius);
            padding: 0.65rem 0.75rem;
            background-color: var(--bs-tertiary-bg);
        }

        .worker-spark-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            min-inline-size: 0;
        }

        .worker-spark-identity {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-inline-size: 0;
        }

        .worker-spark-dot {
            inline-size: 0.55rem;
            block-size: 0.55rem;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .worker-spark-title {
            font-family: var(--bs-font-monospace);
            font-size: 0.82rem;
            font-weight: 600;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .spark-metrics-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 0.5rem 0.75rem;
        }

        @container worker-card (inline-size >= 250px) {
            .spark-metrics-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .spark-metric {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-inline-size: 0;
        }

        .spark-metric-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.35rem;
            font-size: 0.72rem;
            line-height: 1.2;
        }

        .spark-metric-label {
            color: var(--bs-secondary-color);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .spark-metric-value {
            font-family: var(--bs-font-monospace);
            font-weight: 600;
            white-space: nowrap;
        }

        .sparkline-svg {
            display: block;
            inline-size: 100%;
            block-size: 28px;
            overflow: visible;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.8em;
            margin: 0;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-tertiary">
    <header class="sticky-top mb-3 bg-body">
        <div class="container-fluid">
            <div class="row border-bottom align-items-center">
                <div class="col-auto p-2 d-flex" title="" id="server_version">
                    <a href="/" class="text-body text-decoration-none">
                        <svg class="me-2" width="40" height="36" role="img" viewBox="0 0 118 94" xmlns="http://www.w3.org/2000/svg">
                            <path transform="matrix(1 0 -.2566 .9665 0 0)"
                                  d="m38.49 6.154c-7.106 0-12.83 5.723-12.83 12.83l-7.53e-4 59.69c0 7.106 5.722 12.83 12.83 12.83h66.12c7.106 0 12.82-5.723 12.82-12.83l7.5e-4 -59.69c0-7.106-5.722-12.83-12.83-12.83h-66.12zm44.41 16.95 13.81 14.27-0.06917 7.094h-52.62l-0.1147-8.978h40.64l-6.693-6.951 5.048-5.431zm-38.45 27.68h52.62l0.1162 8.984h-40.64l6.691 6.945-5.048 5.431-13.81-14.26 0.06764-7.1z"
                                  fill="currentColor" style="paint-order:stroke markers fill"/>
                        </svg>
                    </a>
                    <div class="d-flex flex-column justify-content-center align-items-start">
                        <div class="lead" id="server_description"></div>
                    </div>
                </div>
                <div class="col d-flex justify-content-end align-items-center gap-3 flex-wrap">
                    <nav class="d-none d-lg-flex small">
                        <a class="me-3 py-2 text-dark text-decoration-none"
                           href="https://github.com/michel4j/swift-rpc/blob/master/README.md">Docs</a>
                        <a class="me-3 py-2 text-dark text-decoration-none" href="https://github.com/michel4j/swift-rpc">Source</a>
                        <a class="me-3 py-2 text-dark text-decoration-none" href="https://pypi.org/project/szrpc/">Releases</a>
                        <a class="py-2 text-dark text-decoration-none" href="https://github.com/michel4j/swift-rpc/issues">Issues</a>
                    </nav>
                </div>
            </div>

            <div class="row border-bottom align-items-center py-2 gap-2">
                <div class="col d-flex flex-row text-secondary align-items-center" id="server_info"></div>
                <div class="col-auto d-flex flex-row align-items-center">
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="auto-refresh" checked>
                        <label class="form-check-label small" for="auto-refresh">Auto-refresh</label>
                    </div>
                </div>
                <div class="col-auto d-flex flex-row align-items-center">
                    <div class="btn-group btn-group-sm" role="group" aria-label="Time window" id="window-selector">
                        <button type="button" class="btn btn-outline-primary active" data-window="15m">15m</button>
                        <button type="button" class="btn btn-outline-primary" data-window="1h">1h</button>
                        <button type="button" class="btn btn-outline-primary" data-window="12h">12h</button>
                        <button type="button" class="btn btn-outline-primary" data-window="1d">1d</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid">
    <div class="row row-cols-1 row-cols-md-4 g-3 text-center" id="stats">
        <div class="col">
            <div class="card mb-3 rounded-3 text-primary-emphasis bg-primary-subtle">
                <div class="card-body">
                    <div class="fs-3 fw-light" id="uptime">-</div>
                    <div class="small text-narrow opacity-50">Uptime</div>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card mb-3 rounded-3 text-info-emphasis bg-info-subtle">
                <div class="card-body">
                    <div class="fs-3 fw-light" id="total_requests">-</div>
                    <div class="small text-narrow opacity-50">Requests</div>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card mb-3 rounded-3 text-danger-emphasis bg-danger-subtle">
                <div class="card-body">
                    <div class="fs-3 fw-light" id="total_errors">-</div>
                    <div class="small text-narrow opacity-50">Failures</div>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card mb-3 rounded-3 text-success-emphasis bg-success-subtle">
                <div class="card-body">
                    <div class="fs-3 fw-light" id="active_workers">-</div>
                    <div class="small text-narrow opacity-50">Workers</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Telemetry & Task Duration Plots -->
    <div class="row g-3 mb-4">
        <div class="col-12">
            <div class="card shadow-sm" id="worker-sparklines-card">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">Workers</span>
                    <small class="text-secondary window-label">15m</small>
                </div>
                <div class="card-body p-3">
                    <div id="worker-sparklines" class="worker-spark-grid"></div>
                </div>
            </div>
        </div>
        <div class="col-12">
            <div class="card shadow-sm chart-card">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">Task Duration by Type (s)</span>
                    <small class="text-secondary window-label">15m</small>
                </div>
                <div class="card-body p-2"><canvas id="durationChart"></canvas></div>
            </div>
        </div>
    </div>

    <!-- Active & Historical Calls -->
    <div class="row align-items-center mb-2 g-2">
        <div class="col-auto lead">Call History</div>
        <div class="col-auto ms-auto d-flex gap-2 flex-wrap">
            <select id="filter-status" class="form-select form-select-sm" style="width: auto;">
                <option value="">All Statuses</option>
                <option value="DONE">DONE</option>
                <option value="ERROR">ERROR</option>
                <option value="ACTIVE">ACTIVE</option>
            </select>
            <input id="filter-method" type="text" class="form-control form-control-sm" placeholder="Filter method..." style="width: 160px;">
            <input id="filter-worker" type="text" class="form-control form-control-sm" placeholder="Filter worker..." style="width: 160px;">
        </div>
    </div>
    <div class="row mb-2">
        <div class="col-12 table-responsive">
            <table class="table table-sm small table-hover">
                <thead>
                <tr>
                    <th>Time</th>
                    <th>Task ID</th>
                    <th>Task Type</th>
                    <th>Worker</th>
                    <th>Status</th>
                    <th>Duration</th>
                </tr>
                </thead>
                <tbody id="active-calls-body"></tbody>
                <tbody id="historical-calls-body"></tbody>
            </table>
        </div>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <small class="text-secondary" id="calls-pagination-info">-</small>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" id="prev-page" disabled>Prev</button>
            <button class="btn btn-outline-secondary" id="next-page" disabled>Next</button>
        </div>
    </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header text-bg-primary" data-bs-theme="dark">
                    <h5 class="modal-title">Job Details</h5>
                    <button type="button" class="btn-close text-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <pre id="modal-content"></pre>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
        crossorigin="anonymous"></script>
<script type="module">
    import {updateWorkerSparklines} from './sparklines.js';

    const PALETTE = ['#0d6efd', '#198754', '#dc3545', '#fd7e14', '#6f42c1', '#20c997', '#0dcaf0', '#6c757d'];
    const PAGE_SIZE = 20;

    let currentWindow = '15m';
    let currentOffset = 0;
    let totalCalls = 0;
    let lastPlotFetch = 0;
    let lastActiveWorkers = new Set();
    let lastWorkerMetrics = {};
    let lastMetricsPayload = {series: {}};
    let sparklinesOffscreen = false;

    function formatDuration(seconds) {
        if (seconds === null || seconds === undefined) return '-';
        seconds = Math.abs(Number(seconds));
        if (seconds > 0 && seconds < 1) return `${(seconds * 1000).toFixed(0)}ms`;

        const days = Math.floor(seconds / (24 * 3600));
        seconds %= (24 * 3600);
        const hours = Math.floor(seconds / 3600);
        seconds %= 3600;
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);

        const parts = [];
        if (days > 0) parts.push(`${days}d`);
        if (hours > 0) parts.push(`${hours}h`);
        if (minutes > 0) parts.push(`${minutes}m`);
        if (remainingSeconds > 0 || parts.length === 0) parts.push(`${remainingSeconds}s`);
        return parts.join(' ');
    }

    function makeCallRow(call, isActive) {
        const tr = document.createElement('tr');

        const tdTime = document.createElement('td');
        tdTime.textContent = call.date_time || '';
        tr.appendChild(tdTime);

        const tdId = document.createElement('td');
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = call.request_id;
        link.addEventListener('click', (e) => {
            e.preventDefault();
            showDetails(call.request_id);
        });
        tdId.appendChild(link);
        tr.appendChild(tdId);

        const tdMethod = document.createElement('td');
        tdMethod.textContent = call.method || '';
        tr.appendChild(tdMethod);

        const tdWorker = document.createElement('td');
        tdWorker.textContent = call.worker_id || '';
        tr.appendChild(tdWorker);

        const tdStatus = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = `badge bg-light border status-${call.status}`;
        badge.textContent = call.status;
        tdStatus.appendChild(badge);
        tr.appendChild(tdStatus);

        const tdDur = document.createElement('td');
        tdDur.textContent = isActive
            ? formatDuration((Date.now() / 1000) - call.start_time)
            : formatDuration(call.duration);
        tr.appendChild(tdDur);

        return tr;
    }

    async function showDetails(requestId) {
        const modalElement = document.getElementById('detailsModal');
        const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
        document.getElementById('modal-content').textContent = 'Loading...';
        modal.show();

        try {
            const response = await fetch(`/api/details/${encodeURIComponent(requestId)}`);
            const data = await response.json();
            document.getElementById('modal-content').textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            document.getElementById('modal-content').textContent = 'Error loading details';
        }
    }

    const durationChart = new Chart(document.getElementById('durationChart').getContext('2d'), {
        type: 'bar',
        data: {labels: [], datasets: []},
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {legend: {display: false, position: 'bottom', labels: {boxWidth: 12}}},
            scales: {
                y: {beginAtZero: true, title: {display: true, text: 'seconds'}},
            },
        },
    });

    function renderSparklines() {
        updateWorkerSparklines({
            container: document.getElementById('worker-sparklines'),
            metricsPayload: lastMetricsPayload,
            activeWorkers: lastActiveWorkers,
            workerMetrics: lastWorkerMetrics,
            palette: PALETTE,
            offscreen: sparklinesOffscreen,
        });
    }

    function updateDurationChart(summaryPayload) {
        const methods = summaryPayload.methods || [];
        durationChart.data.labels = methods.map(m => `${m.method} (${m.count})`);
        durationChart.data.datasets = [
            {
                label: 'Avg (s)',
                data: methods.map(m => m.avg_duration),
                backgroundColor: '#0d6efd99',
                borderColor: '#0d6efd',
                borderWidth: 1,
            },
            {
                label: 'p95 (s)',
                data: methods.map(m => m.p95_duration),
                backgroundColor: '#fd7e1499',
                borderColor: '#fd7e14',
                borderWidth: 1,
            },
        ];
        durationChart.update('none');
    }

    async function fetchCalls() {
        const params = new URLSearchParams({
            window: currentWindow,
            limit: String(PAGE_SIZE),
            offset: String(currentOffset),
        });
        const status = document.getElementById('filter-status').value;
        const method = document.getElementById('filter-method').value.trim();
        const worker = document.getElementById('filter-worker').value.trim();
        if (status) params.set('status', status);
        if (method) params.set('method', method);
        if (worker) params.set('worker_id', worker);

        const res = await fetch(`/api/calls?${params.toString()}`);
        const payload = await res.json();
        totalCalls = payload.total || 0;

        const historicalBody = document.getElementById('historical-calls-body');
        historicalBody.replaceChildren(...(payload.calls || []).map(c => makeCallRow(c, false)));

        const start = totalCalls === 0 ? 0 : currentOffset + 1;
        const end = Math.min(currentOffset + PAGE_SIZE, totalCalls);
        document.getElementById('calls-pagination-info').textContent =
            `Showing ${start}-${end} of ${totalCalls} (${currentWindow})`;
        document.getElementById('prev-page').disabled = currentOffset <= 0;
        document.getElementById('next-page').disabled = currentOffset + PAGE_SIZE >= totalCalls;
    }

    async function fetchPlots() {
        const [metricsRes, summaryRes] = await Promise.all([
            fetch(`/api/metrics/workers?window=${encodeURIComponent(currentWindow)}`),
            fetch(`/api/summary?window=${encodeURIComponent(currentWindow)}`),
        ]);
        lastMetricsPayload = await metricsRes.json();
        renderSparklines();
        updateDurationChart(await summaryRes.json());
        lastPlotFetch = Date.now();
    }

    async function updateData(forcePlots = false) {
        try {
            const response = await fetch('/api/data');
            const data = await response.json();

            const nextActive = new Set(data.workers || []);
            const workersChanged =
                nextActive.size !== lastActiveWorkers.size ||
                Array.from(nextActive).some(w => !lastActiveWorkers.has(w));
            lastActiveWorkers = nextActive;
            lastWorkerMetrics = data.worker_metrics || {};

            document.getElementById('server_description').textContent = data.description || '';
            document.getElementById('uptime').textContent = formatDuration(data.stats.uptime);
            document.getElementById('total_requests').textContent = data.stats.total_requests;
            document.getElementById('total_errors').textContent = data.stats.total_errors;
            document.getElementById('active_workers').textContent = data.stats.active_workers_count;
            document.getElementById('server_version').title = `Swift RPC Server ${data.version || ''}`;

            const serverInfo = document.getElementById('server_info');
            const items = [
                ['frontend', data.frontend || ''],
                ['backend', data.backend || ''],
                ['methods', (data.methods || []).join(', ')],
            ];
            serverInfo.replaceChildren(...items.map(([k, v]) => {
                const wrap = document.createElement('div');
                wrap.append(`${k}: `);
                const span = document.createElement('span');
                span.className = 'server-value';
                span.textContent = v;
                wrap.appendChild(span);
                return wrap;
            }));

            const activeBody = document.getElementById('active-calls-body');
            activeBody.replaceChildren(...(data.active_calls || []).map(c => makeCallRow(c, true)));

            await fetchCalls();

            if (forcePlots || Date.now() - lastPlotFetch >= 5000) {
                await fetchPlots();
            } else if (workersChanged) {
                renderSparklines();
            }
        } catch (e) {
            console.error('Failed to fetch data', e);
        }
    }

    document.getElementById('worker-sparklines-card').addEventListener('contentvisibilityautostatechange', (event) => {
        sparklinesOffscreen = event.skipped;
        if (!event.skipped) {
            renderSparklines();
        }
    });

    document.querySelectorAll('#window-selector button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#window-selector button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentWindow = btn.dataset.window;
            currentOffset = 0;
            document.querySelectorAll('.window-label').forEach(el => { el.textContent = currentWindow; });
            updateData(true);
        });
    });

    ['filter-status', 'filter-method', 'filter-worker'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
            currentOffset = 0;
            fetchCalls();
        });
    });

    document.getElementById('prev-page').addEventListener('click', () => {
        currentOffset = Math.max(0, currentOffset - PAGE_SIZE);
        fetchCalls();
    });

    document.getElementById('next-page').addEventListener('click', () => {
        if (currentOffset + PAGE_SIZE < totalCalls) {
            currentOffset += PAGE_SIZE;
            fetchCalls();
        }
    });

    setInterval(() => {
        if (document.getElementById('auto-refresh').checked) {
            updateData(false);
        }
    }, 1000);

    updateData(true);

    function applyChartFont() {
        const styles = getComputedStyle(document.body);
        const bootstrapFont = styles.getPropertyValue('--bs-body-font-family').trim() || styles.fontFamily;
        Chart.defaults.font.family = bootstrapFont;
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyChartFont);
    } else {
        applyChartFont();
    }

</script>
</body>
</html>
