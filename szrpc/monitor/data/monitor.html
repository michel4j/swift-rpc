<!DOCTYPE html>
<html lang="en">
<head>
    <title>Swift RPC Server</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <style>
        :root {
            --bs-body-font-size: 0.95rem;
            --bs-border-radius: 0.25rem;
            --bs-border-radius-lg: 0.25rem;
            --bs-border-radius-sm: 0.25rem;
        }
        .card {
            --bs-card-border-width: 0;
        }

        .status-ACTIVE {
            color: var(--bs-primary);
            font-weight: bold;
        }

        .status-DONE {
            color: var(--bs-success);
            font-weight: bold;
        }

        .status-ERROR {
            color: var(--bs-danger);
            font-weight: bold;
        }

        .table {
            --bs-table-bg: transparent !important;
            background-color: transparent !important;
        }

        td {
            /*font-family: monospace;*/
            font-size: 0.8rem;
        }

        #server_info {
            font-size: 0.8rem;
            opacity: 0.7;
            column-gap: 1em;
        }

        .server-value {
            font-family: monospace;
            color: var(--bs-primary);
        }

        .duration-table-wrapper {
            overflow: auto;
            max-inline-size: 100%;
            max-block-size: min(320px, 60vh);
            container-type: inline-size;
        }

        .duration-table {
            border-collapse: separate;
            border-spacing: 0;
            --label-2: "Calls";
            --label-3: "Errors";
            --label-4: "Min";
            --label-5: "Avg";
            --label-6: "p95";
            --label-7: "Max";
            --label-8: "Payload";
        }

        .duration-table thead {
            position: sticky;
            inset-block-start: 0;
            z-index: 1;
            background-color: var(--bs-body-bg);
        }

        .duration-table tbody th {
            position: sticky;
            inset-inline-start: 0;
            background-color: var(--bs-body-bg);
            font-family: var(--bs-font-monospace);
            font-weight: 600;
            white-space: nowrap;
        }

        .duration-table td.num,
        .duration-table th.num {
            text-align: end;
            font-family: var(--bs-font-monospace);
            white-space: nowrap;
        }

        @container (width < 540px) {
            .duration-table,
            .duration-table thead,
            .duration-table tbody,
            .duration-table tr,
            .duration-table th,
            .duration-table td {
                display: block;
            }

            .duration-table thead {
                display: none;
            }

            .duration-table tbody tr:not(.empty-row) {
                margin-block-end: 0.75rem;
                border: 1px solid var(--bs-border-color);
                border-radius: var(--bs-border-radius);
                padding: 0.25rem 0.5rem;
            }

            .duration-table tbody th {
                position: sticky;
                inset-block-start: 0;
                z-index: 2;
                border-bottom: 1px solid var(--bs-border-color);
            }

            .duration-table td.num {
                display: flex;
                justify-content: space-between;
                text-align: end;
            }

            .duration-table td:nth-child(2)::before { content: var(--label-2) ": "; color: var(--bs-secondary-color); font-family: var(--bs-body-font-family); }
            .duration-table td:nth-child(3)::before { content: var(--label-3) ": "; color: var(--bs-secondary-color); font-family: var(--bs-body-font-family); }
            .duration-table td:nth-child(4)::before { content: var(--label-4) ": "; color: var(--bs-secondary-color); font-family: var(--bs-body-font-family); }
            .duration-table td:nth-child(5)::before { content: var(--label-5) ": "; color: var(--bs-secondary-color); font-family: var(--bs-body-font-family); }
            .duration-table td:nth-child(6)::before { content: var(--label-6) ": "; color: var(--bs-secondary-color); font-family: var(--bs-body-font-family); }
            .duration-table td:nth-child(7)::before { content: var(--label-7) ": "; color: var(--bs-secondary-color); font-family: var(--bs-body-font-family); }
            .duration-table td:nth-child(8)::before { content: var(--label-8) ": "; color: var(--bs-secondary-color); font-family: var(--bs-body-font-family); }
        }

        #worker-sparklines-card {
            content-visibility: auto;
            contain-intrinsic-size: auto none auto 220px;
        }

        .worker-spark-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 0.75rem;
        }

        .worker-spark-card {
            container: worker-card / inline-size;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border: 1px solid var(--bs-border-color);
            border-radius: var(--bs-border-radius);
            padding: 0.65rem 0.75rem;
            background-color: var(--bs-tertiary-bg);
        }

        .worker-spark-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            min-inline-size: 0;
        }

        .worker-spark-identity {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-inline-size: 0;
        }

        .worker-spark-dot {
            inline-size: 0.55rem;
            block-size: 0.55rem;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .worker-spark-title {
            font-family: var(--bs-font-monospace);
            font-size: 0.82rem;
            font-weight: 600;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .spark-metrics-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 0.5rem 0.75rem;
        }

        @container worker-card (inline-size >= 250px) {
            .spark-metrics-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .spark-metric {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-inline-size: 0;
        }

        .spark-metric-full {
            grid-column: 1 / -1;
        }

        .spark-metric-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.35rem;
            font-size: 0.72rem;
            line-height: 1.2;
        }

        .spark-metric-label {
            color: var(--bs-secondary-color);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .spark-metric-value {
            font-family: var(--bs-font-monospace);
            font-weight: 600;
            white-space: nowrap;
        }

        .sparkline-svg {
            display: block;
            inline-size: 100%;
            block-size: 28px;
            overflow: visible;
        }

        .sparkline-svg-tall {
            block-size: 32px;
        }

        .worker-spark-footer {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            margin-top: auto;
            padding-top: 0.45rem;
            border-top: 1px solid var(--bs-border-color);
            font-size: 0.72rem;
            min-inline-size: 0;
        }

        .worker-methods-label {
            color: var(--bs-secondary-color);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }

        .worker-methods-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            list-style: none;
            margin: 0;
            padding: 0;
            min-inline-size: 0;
        }

        .worker-method-tag {
            font-family: var(--bs-font-monospace);
            font-size: 0.68rem;
            padding: 0.08rem 0.35rem;
            border: 1px solid var(--bs-border-color);
            border-radius: var(--bs-border-radius-sm);
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
        }

        .worker-methods-empty {
            color: var(--bs-secondary-color);
            font-family: var(--bs-font-monospace);
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.8em;
            margin: 0;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script type="module">
    import {updateWorkerSparklines} from './sparklines.js';

    const PALETTE = ['#0d6efd', '#198754', '#dc3545', '#fd7e14', '#6f42c1', '#20c997', '#0dcaf0', '#6c757d'];
    const PAGE_SIZE = 20;

    let currentWindow = '15m';
    let currentOffset = 0;
    let totalCalls = 0;
    let lastPlotFetch = 0;
    let lastActiveWorkers = new Set();
    let lastWorkerMetrics = {};
    let lastWorkerMethods = {};
    let lastMetricsPayload = {series: {}};
    let lastTasksPayload = {tasks: {}};
    let sparklinesOffscreen = false;

    function formatDuration(seconds) {
        if (seconds === null || seconds === undefined) return '-';
        seconds = Math.abs(Number(seconds));
        if (seconds > 0 && seconds < 1) return `${(seconds * 1000).toFixed(0)}ms`;

        const days = Math.floor(seconds / (24 * 3600));
        seconds %= (24 * 3600);
        const hours = Math.floor(seconds / 3600);
        seconds %= 3600;
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);

        const parts = [];
        if (days > 0) parts.push(`${days}d`);
        if (hours > 0) parts.push(`${hours}h`);
        if (minutes > 0) parts.push(`${minutes}m`);
        if (remainingSeconds > 0 || parts.length === 0) parts.push(`${remainingSeconds}s`);
        return parts.join(' ');
    }

    function makeCallRow(call, isActive) {
        const tr = document.createElement('tr');

        const tdTime = document.createElement('td');
        tdTime.textContent = call.date_time || '';
        tr.appendChild(tdTime);

        const tdId = document.createElement('td');
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = call.request_id;
        link.addEventListener('click', (e) => {
            e.preventDefault();
            showDetails(call.request_id);
        });
        tdId.appendChild(link);
        tr.appendChild(tdId);

        const tdMethod = document.createElement('td');
        tdMethod.textContent = call.method || '';
        tr.appendChild(tdMethod);

        const tdWorker = document.createElement('td');
        tdWorker.textContent = call.worker_id || '';
        tr.appendChild(tdWorker);

        const tdStatus = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = `badge bg-light border status-${call.status}`;
        badge.textContent = call.status;
        tdStatus.appendChild(badge);
        tr.appendChild(tdStatus);

        const tdDur = document.createElement('td');
        tdDur.textContent = isActive
            ? formatDuration((Date.now() / 1000) - call.start_time)
            : formatDuration(call.duration);
        tr.appendChild(tdDur);

        return tr;
    }

    async function showDetails(requestId) {
        const modalElement = document.getElementById('detailsModal');
        const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
        document.getElementById('modal-content').textContent = 'Loading...';
        modal.show();

        try {
            const response = await fetch(`/api/details/${encodeURIComponent(requestId)}`);
            const data = await response.json();
            document.getElementById('modal-content').textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            document.getElementById('modal-content').textContent = 'Error loading details';
        }
    }

    function formatBytes(bytes) {
        const val = Number(bytes || 0);
        if (val < 1024) return `${val} B`;
        if (val < 1024 * 1024) return `${(val / 1024).toFixed(1)} KB`;
        if (val < 1024 * 1024 * 1024) return `${(val / (1024 * 1024)).toFixed(2)} MB`;
        return `${(val / (1024 * 1024 * 1024)).toFixed(2)} GB`;
    }

    function renderSparklines() {
        updateWorkerSparklines({
            container: document.getElementById('worker-sparklines'),
            metricsPayload: lastMetricsPayload,
            tasksPayload: lastTasksPayload,
            activeWorkers: lastActiveWorkers,
            workerMetrics: lastWorkerMetrics,
            workerMethods: lastWorkerMethods,
            palette: PALETTE,
            formatDuration,
            offscreen: sparklinesOffscreen,
        });
    }

    function updateDurationTable(summaryPayload) {
        const methods = summaryPayload.methods || [];
        const tbody = document.getElementById('duration-table-body');
        if (methods.length === 0) {
            const tr = document.createElement('tr');
            tr.className = 'empty-row';
            const td = document.createElement('td');
            td.colSpan = 8;
            td.className = 'text-secondary text-center py-3';
            td.textContent = 'No tasks recorded in this window.';
            tr.appendChild(td);
            tbody.replaceChildren(tr);
            return;
        }

        const rows = methods.map(m => {
            const tr = document.createElement('tr');

            const th = document.createElement('th');
            th.scope = 'row';
            th.textContent = m.method || '';
            tr.appendChild(th);

            const cells = [
                {text: String(m.count ?? 0)},
                {text: String(m.errors ?? 0), cls: (m.errors || 0) > 0 ? 'num text-danger fw-semibold' : 'num'},
                {text: formatDuration(m.min_duration)},
                {text: formatDuration(m.avg_duration)},
                {text: formatDuration(m.p95_duration)},
                {text: formatDuration(m.max_duration)},
                {text: formatBytes(m.total_bytes)},
            ];
            cells.forEach(({text, cls}) => {
                const td = document.createElement('td');
                td.className = cls || 'num';
                td.textContent = text;
                tr.appendChild(td);
            });
            return tr;
        });

        tbody.replaceChildren(...rows);
    }

    async function fetchCalls() {
        const params = new URLSearchParams({
            window: currentWindow,
            limit: String(PAGE_SIZE),
            offset: String(currentOffset),
        });
        const status = document.getElementById('filter-status').value;
        const method = document.getElementById('filter-method').value.trim();
        const worker = document.getElementById('filter-worker').value.trim();
        if (status) params.set('status', status);
        if (method) params.set('method', method);
        if (worker) params.set('worker_id', worker);

        const res = await fetch(`/api/calls?${params.toString()}`);
        const payload = await res.json();
        totalCalls = payload.total || 0;

        const historicalBody = document.getElementById('historical-calls-body');
        historicalBody.replaceChildren(...(payload.calls || []).map(c => makeCallRow(c, false)));

        const start = totalCalls === 0 ? 0 : currentOffset + 1;
        const end = Math.min(currentOffset + PAGE_SIZE, totalCalls);
        document.getElementById('calls-pagination-info').textContent =
            `Showing ${start}-${end} of ${totalCalls} (${currentWindow})`;
        document.getElementById('prev-page').disabled = currentOffset <= 0;
        document.getElementById('next-page').disabled = currentOffset + PAGE_SIZE >= totalCalls;
    }

    async function fetchPlots() {
        const [metricsRes, tasksRes, summaryRes] = await Promise.all([
            fetch(`/api/metrics/workers?window=${encodeURIComponent(currentWindow)}`),
            fetch(`/api/metrics/tasks?window=${encodeURIComponent(currentWindow)}`),
            fetch(`/api/summary?window=${encodeURIComponent(currentWindow)}`),
        ]);
        lastMetricsPayload = await metricsRes.json();
        lastTasksPayload = await tasksRes.json();
        renderSparklines();
        updateDurationTable(await summaryRes.json());
        lastPlotFetch = Date.now();
    }

    async function updateData(forcePlots = false) {
        try {
            const response = await fetch('/api/data');
            const data = await response.json();

            const nextActive = new Set(data.workers || []);
            const workersChanged =
                nextActive.size !== lastActiveWorkers.size ||
                Array.from(nextActive).some(w => !lastActiveWorkers.has(w));
            lastActiveWorkers = nextActive;
            lastWorkerMetrics = data.worker_metrics || {};
            const nextWorkerMethods = data.worker_methods || {};
            const methodsChanged = JSON.stringify(nextWorkerMethods) !== JSON.stringify(lastWorkerMethods);
            lastWorkerMethods = nextWorkerMethods;

            document.getElementById('server_description').textContent = data.description || '';
            document.getElementById('uptime').textContent = formatDuration(data.stats.uptime);
            document.getElementById('total_requests').textContent = data.stats.total_requests;
            document.getElementById('total_errors').textContent = data.stats.total_errors;
            document.getElementById('active_workers').textContent = data.stats.active_workers_count;
            document.getElementById('server_version').title = `Swift RPC Server ${data.version || ''}`;

            const serverInfo = document.getElementById('server_info');
            const items = [
                ['frontend', data.frontend || ''],
                ['backend', data.backend || ''],
                ['methods', (data.methods || []).join(', ')],
            ];
            serverInfo.replaceChildren(...items.map(([k, v]) => {
                const wrap = document.createElement('div');
                wrap.append(`${k}: `);
                const span = document.createElement('span');
                span.className = 'server-value';
                span.textContent = v;
                wrap.appendChild(span);
                return wrap;
            }));

            const activeBody = document.getElementById('active-calls-body');
            activeBody.replaceChildren(...(data.active_calls || []).map(c => makeCallRow(c, true)));

            await fetchCalls();

            if (forcePlots || Date.now() - lastPlotFetch >= 5000) {
                await fetchPlots();
            } else if (workersChanged || methodsChanged) {
                renderSparklines();
            }
        } catch (e) {
            console.error('Failed to fetch data', e);
        }
    }

    document.getElementById('worker-sparklines-card').addEventListener('contentvisibilityautostatechange', (event) => {
        sparklinesOffscreen = event.skipped;
        if (!event.skipped) {
            renderSparklines();
        }
    });

    document.querySelectorAll('#window-selector button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#window-selector button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentWindow = btn.dataset.window;
            currentOffset = 0;
            document.querySelectorAll('.window-label').forEach(el => { el.textContent = currentWindow; });
            updateData(true);
        });
    });

    ['filter-status', 'filter-method', 'filter-worker'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
            currentOffset = 0;
            fetchCalls();
        });
    });

    document.getElementById('prev-page').addEventListener('click', () => {
        currentOffset = Math.max(0, currentOffset - PAGE_SIZE);
        fetchCalls();
    });

    document.getElementById('next-page').addEventListener('click', () => {
        if (currentOffset + PAGE_SIZE < totalCalls) {
            currentOffset += PAGE_SIZE;
            fetchCalls();
        }
    });

    setInterval(() => {
        if (document.getElementById('auto-refresh').checked) {
            updateData(false);
        }
    }, 1000);

    updateData(true);

</script>
</body>
</html>
