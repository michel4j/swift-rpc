[project]
name = "szrpc"
dynamic = ["version"]
description = " Simple ZeroMQ RPC in Python"
readme = "README.md"
readme-content-type = "text/markdown"
license = "MIT"
authors = [
    {name = "Michel Fodje",email = "michel.fodje@lightsource.ca"}
]
keywords = ["RPC", "ZeroMQ", "Networking", "Development"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "msgpack",
    "pyzmq",
]

[project.optional-dependencies]
dash = ["fastapi", "uvcorn"]
gtk = ["pygobject"]
qt = ["pyside6"]
dev = ["fastapi", "uvcorn", "pygobject", "pygobject-stubs", "pyside6", "pytest"]

[project.urls]
Homepage = "https://github.com/michel4j/swift-rpc"
Issues = "https://github.com/michel4j/swift-rpc/issues"


[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["szrpc"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440" # Options: "pep440", "semver", "pvp"
fallback-version = "0.0.0" # Used if building outside a Git repo (e.g., from an sdist)
format = "{base}.{revision}{distance}"


[tool.pytest.ini_options]
testpaths = ["tests"]